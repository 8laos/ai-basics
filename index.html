<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Basics Playground</title>
<link rel="icon" href="thumbnails/favicon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Orbit&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'KoPub World 돋움';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2102_ko@1.0/KoPubWorldDotumMedium.woff') format('woff');
  font-weight: 400;
}

@font-face {
  font-family: 'KoPub World 돋움';
  src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2102_ko@1.0/KoPubWorldDotumBold.woff') format('woff');
  font-weight: 700;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #f5f3e8;
  background-image: radial-gradient(circle, rgba(107,140,99,.12) 1px, transparent 1px);
  background-size: 24px 24px;
  color: #3a3a2a;
  font-family: 'KoPub World 돋움', 'Malgun Gothic', sans-serif;
  min-height: 100vh;
  padding: 32px 16px;
  word-break: keep-all;
}

.container {
  max-width: 1280px;
  margin: 0 auto;
}

h1 {
  font-family: 'Orbit', 'KoPub World 돋움', sans-serif;
  font-size: clamp(1.9rem, 9vw, 3rem);
  text-align: center;
  margin-bottom: 8px;
  letter-spacing: .04em;
  color: #3a3a2a;
}

.subtitle {
  text-align: center;
  font-size: .95rem;
  color: #888;
  margin-bottom: 14px;
}

.legend {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  font-size: .78rem;
  color: #777;
  margin-bottom: 32px;
}

.category {
  margin-bottom: 28px;
  background: #6b8c63;
  border-radius: 14px;
  padding: 22px 22px 24px;
  box-shadow: 0 6px 20px rgba(0,0,0,.15);
}

.category-header {
  display: inline-block;
  background: #e8a0aa;
  border-radius: 10px;
  padding: 8px 24px 10px;
  margin-bottom: 8px;
}

.category-title {
  font-family: 'Orbit', sans-serif;
  font-size: 1.3rem;
  letter-spacing: .03em;
  font-weight: 700;
  color: #f2f1df;
}

.category-desc {
  font-size: .95rem;
  color: #b0c4a0;
  margin-bottom: 14px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}

.card {
  background: rgba(255,255,255,.85);
  border-radius: 10px;
  text-decoration: none;
  color: #3a3a2a;
  box-shadow: 0 2px 8px rgba(0,0,0,.1);
  transition: transform .2s, box-shadow .2s, background .2s;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.card:hover {
  transform: translateY(-4px);
  background: rgba(255,255,255,.95);
  box-shadow: 0 8px 24px rgba(0,0,0,.1);
}

.card-thumb {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  object-position: center top;
  display: block;
  transition: transform .3s;
}

.card:hover .card-thumb {
  transform: scale(1.05);
}

.card-body {
  padding: 14px 18px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.card-title {
  font-family: 'Orbit', sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 6px;
  color: #2a2a1a;
}

.tag {
  display: inline-block;
  font-size: .65rem;
  font-weight: 700;
  background: #e8a0aa;
  color: #fff;
  padding: 1px 7px;
  border-radius: 4px;
  vertical-align: middle;
  margin-right: 2px;
}

.card-desc {
  font-size: .82rem;
  color: #666;
  line-height: 1.5;
  flex: 1;
}

.card-foot {
  margin-top: 10px;
  display: flex;
  justify-content: flex-end;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.bounce-title span {
  display: inline-block;
  animation: bounce 2s ease-in-out infinite;
  animation-delay: calc(var(--i) * .08s);
}

.bounce-title .word {
  white-space: nowrap;
  animation: none;
}

/* 폰 화면 */
@media (max-width: 480px) {
  body {
    padding: 24px 12px;
  }

  .category {
    padding: 16px 14px 18px;
  }

  .category-header {
    padding: 6px 16px 8px;
  }
}

footer {
  text-align: center;
  margin-top: 48px;
  padding-top: 16px;
  border-top: 1px solid rgba(0,0,0,.12);
  font-size: .7rem;
  color: #9a9a7a;
}

footer a {
  color: #9a9a7a;
  text-decoration: underline;
}

.maker {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 8px;
}

.maker img {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  vertical-align: middle;
  object-fit: cover;
}
</style>
</head>

window.onLangChange = function () {
  var h = document.getElementById('site-title');
  var txt = t('title');
  h.setAttribute('aria-label', txt);
  // 단어 단위로 묶어 단어 중간에서 줄이 바뀌지 않게 함
  var i = 0;
  h.innerHTML = txt.split(' ').map(function (word) {
    var chars = Array.prototype.map.call(word, function (ch) {
      return '<span style="--i:' + (i++) + '">' + ch + '</span>';
    }).join('');
    i++;
    return '<span class="word">' + chars + '</span>';
  }).join(' ');
};
